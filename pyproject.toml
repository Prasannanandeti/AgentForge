[project]
name = "customer-support-rl-env"
version = "0.1.0"
description = "Customer Support RL Environment for OpenEnv Hackathon"
authors = [
    { name = "Prasanna Lakshmi Nandeti" },
    { name = "Pujitha Bollina" }
]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "pydantic>=2.0.0",
    "openenv-core>=0.2.0"
]

[project.scripts]
server = "app:main"

[tool.openenv]
entrypoint = "app:main"
